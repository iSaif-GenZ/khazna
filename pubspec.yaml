name: khazna
description: "Financial management application."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  isar_community: ^3.1.8
  isar_community_flutter_libs: ^3.1.8
  path_provider: ^2.1.6
  intl: ^0.20.3
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  persistent_bottom_nav_bar_v2: ^6.3.2
  flutter_slidable: ^4.0.3
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  isar_community_generator: ^3.1.8
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  fonts:
    - family: Arial
      fonts:
        - asset: fonts/ARIAL.TTF
          weight: 400
        - asset: fonts/ARIALBD 1.TTF
          weight: 700

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/khazna_icon.png"
  min_sdk_android: 21

  # الأيقونات التكيفية لأندرويد (Adaptive Icons)
  adaptive_icon_background: "#121b28" # اللون الداكن الخارجي الدقيق للصورة
  adaptive_icon_foreground: "assets/images/khazna_icon.png" # الصورة الشفافة بدون خلفية
